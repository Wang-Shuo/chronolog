[project]
name = "chronolog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "python-frontmatter>=1.1.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]
browser = ["playwright==1.56.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["_scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
