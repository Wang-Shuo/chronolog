name: Open delivery PR
on:
  workflow_dispatch:
    inputs:
      head:
        description: Existing codex/ branch to submit for human review
        type: string
        required: true
        default: codex/m3-delivery
      title:
        description: Delivery PR title
        type: string
        required: true
        default: Deliver ChronoLog changes for human review
      body:
        description: Change description and validation evidence
        type: string
        required: true
permissions:
  contents: read
  pull-requests: write
  actions: write
concurrency:
  group: delivery-pr-${{ inputs.head }}
  cancel-in-progress: false
jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open bot-authored delivery PR and dispatch Quality
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_TITLE: ${{ inputs.title }}
          PR_BODY: ${{ inputs.body }}
        run: |
          case "$HEAD_BRANCH" in codex/*) ;; *) echo 'Delivery branches must use codex/.'; exit 1;; esac
          git check-ref-format --branch "$HEAD_BRANCH"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_BRANCH" --jq .object.sha)"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --state all --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            state="$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [ "$state" = MERGED ]; then
              echo "Already delivered in PR #$existing. Use a new branch for new work."
              exit 0
            fi
          fi
          if [ -n "$existing" ] && [ "$state" = OPEN ]; then
            author="$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json author --jq .author.login)"
            test "$author" = 'app/github-actions' || { echo 'Existing delivery PR must be bot-authored.'; exit 1; }
            gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json url --jq .url
          else
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/delivery.md"
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$HEAD_BRANCH" \
              --title "$PR_TITLE" --body-file "$RUNNER_TEMP/delivery.md"
          fi
          gh workflow run quality.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH" -f "expected_head=$head_sha"
