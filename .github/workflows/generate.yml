name: Generate review candidate
on:
  schedule:
    - cron: '15 1 * * *' # 09:15 Asia/Shanghai
  workflow_dispatch:
    inputs:
      preview:
        description: Read-only live preview on the selected branch (no push or PR)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: chronolog-rolling-generation
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.preview)
    permissions:
      contents: read
      pull-requests: read
    # Keep browser system dependencies on an OS supported by the pinned Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare managed review branch
        if: inputs.preview != true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m _scripts.rolling_pr prepare --base "$BASE_BRANCH" --state _pipeline/rolling-state.json
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      # Automatic browser capture of the ChatGPT page is opt-in (repository variable
      # CHRONOLOG_BROWSER_FALLBACK=true): the Help Center answers automated HTTP with 403,
      # and a capture that only succeeds in a headed browser works around that refusal.
      # Off, ChatGPT keeps its reviewed history and is refreshed from a manual snapshot.
      - name: Install optional browser collector
        if: vars.CHRONOLOG_BROWSER_FALLBACK == 'true'
        continue-on-error: true
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chrome
      - name: Collect and gate isolated candidate
        env:
          SITE_BASE: ${{ vars.CHRONOLOG_BASE_URL }}
          CHRONOLOG_GITHUB_READ_TOKEN: ${{ github.token }}
          CHRONOLOG_BROWSER_HEADED: '1'
          CHRONOLOG_BROWSER_CHANNEL: chrome
          BROWSER_FALLBACK: ${{ vars.CHRONOLOG_BROWSER_FALLBACK }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          base="${SITE_BASE:-${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          args=(python -m _scripts.operations --mode generate --run-id "daily-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output _pipeline/operations --base-url "$base" --production --allow-partial)
          if [ "$PREVIEW" != true ]; then args+=(--apply); fi
          if [ "$BROWSER_FALLBACK" = true ]; then args+=(--browser-fallback); fi
          if [ "$BROWSER_FALLBACK" = true ] && command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a "${args[@]}"
          else
            # A missing display/browser is recorded as a source failure; healthy sources continue.
            "${args[@]}"
          fi
      - name: Export gated candidate without writing to GitHub
        if: inputs.preview != true
        run: python -m _scripts.rolling_pr package --state _pipeline/rolling-state.json --report _pipeline/operations --bundle _pipeline/publication
      - uses: actions/upload-artifact@v4
        if: inputs.preview != true
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: _pipeline/publication/
      - name: Summary and setup-failure record
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          out = Path('_pipeline/operations')
          out.mkdir(parents=True, exist_ok=True)
          if not (out / 'quality.json').exists():
              report = {'run_id': os.environ['GITHUB_RUN_ID'], 'status': 'failed', 'phase': 'setup',
                  'input_kind': 'live', 'error': 'Stopped before operations; inspect GitHub job logs.',
                  'sources': [{'product': p, 'status': 'not-attempted'} for p in ['chatgpt', 'claude-code', 'cursor']]}
              (out / 'quality.json').write_text(json.dumps(report, indent=2) + '\n')
              (out / 'quality.md').write_text('# ChronoLog: setup failed\n\nNo candidate was published. Inspect checkout, credentials, branch conflicts and dependency logs.\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write((out / 'quality.md').read_text())
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            _pipeline/rolling-state.json
            _pipeline/operations/*.json
            _pipeline/operations/*.json.gz
            _pipeline/operations/*.html
            _pipeline/operations/*.md
            _pipeline/operations/*.log
            _pipeline/operations/browser/
            _pipeline/operations/candidate/_pipeline/*/manifest.json
            _pipeline/operations/candidate/_pipeline/*/04-validated/*.json
            _pipeline/operations/candidate/_pipeline/dlq/*.json

  publish:
    needs: generate
    if: inputs.preview != true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Run only trusted workflow code; never check out or execute the artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: _pipeline/publication
      - name: Publish content PR and explicitly dispatch Quality
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh auth setup-git
          python -m _scripts.rolling_pr publish-bundle --base "$BASE_BRANCH" --bundle _pipeline/publication
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: _pipeline/publication/rolling-pr.json

  # A degraded run exits 0 and a waiting review PR is silent, so one issue carries the
  # pipeline's state: opened or commented while something needs attention, closed on
  # recovery. The job fails when a run failed or a source's reviewed data is too old.
  notify:
    needs: [generate, publish]
    if: always() && inputs.preview != true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        # A run that stopped before uploading its report is assessed as failed.
        continue-on-error: true
        with:
          name: generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: _pipeline/generation
      - name: Update the pipeline health issue
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m _scripts.pipeline_health --quality _pipeline/generation/operations/quality.json \
            --publish-result "$PUBLISH_RESULT" --base "$BASE_BRANCH" --owner "$OWNER" --run-url "$RUN_URL"
