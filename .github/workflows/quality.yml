name: Quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - name: Test, validate, build and audit RSS
        env:
          SITE_BASE: ${{ vars.CHRONOLOG_BASE_URL }}
        run: |
          base="${SITE_BASE:-${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          python -m _scripts.operations --mode check --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output _pipeline/ci --base-url "$base" --production
      - name: Summary and setup-failure record
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          out = Path('_pipeline/ci')
          out.mkdir(parents=True, exist_ok=True)
          if not (out / 'quality.json').exists():
              report = {'run_id': os.environ['GITHUB_RUN_ID'], 'status': 'failed', 'phase': 'setup',
                  'input_kind': 'committed-vault', 'error': 'Stopped before operations; inspect GitHub job logs.',
                  'sources': [{'product': p, 'status': 'not-attempted'} for p in ['chatgpt', 'claude-code', 'cursor']]}
              (out / 'quality.json').write_text(json.dumps(report, indent=2) + '\n')
              (out / 'quality.md').write_text('# ChronoLog: setup failed\n\nNo candidate was published. Inspect checkout, credentials, branch conflicts and dependency logs.\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write((out / 'quality.md').read_text())
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            _pipeline/ci/*.json
            _pipeline/ci/*.md
            _pipeline/ci/*.log
