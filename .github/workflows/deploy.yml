name: Deploy reviewed site
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: chronolog-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require a reviewed merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m _scripts.review_gate --commit "$GITHUB_SHA" --base "$BASE_BRANCH" --output _pipeline/review-gate.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - name: Build exact reviewed commit
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base="${PAGES_URL#https://}"
          python -m _scripts.operations --mode check --run-id "deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output _pipeline/deploy --base-url "$base" --production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pipeline/deploy/site
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            _pipeline/review-gate.json
            _pipeline/deploy/*.json
            _pipeline/deploy/*.md
            _pipeline/deploy/*.log
            _pipeline/deploy/site/deployment.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public commit and RSS
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m _scripts.verify_public --url "$PUBLIC_URL" --commit "$GITHUB_SHA" --output _pipeline/public-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: _pipeline/public-verification.json
