    backfill: full
    max_staleness_days: 2
    known_gaps: English US Gemini Apps release notes available from the official page, including its historical Bard entries. Regional availability can differ. Gemini CLI and the developer API have separate release histories.
    themes: [model-support, multimodal, voice, image-generation, search-browsing, apps-integrations, memory, mobile-desktop]
    track_silence: true
    silence_window: month
    silence_periods: 2
