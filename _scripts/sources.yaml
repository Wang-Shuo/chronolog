    backfill: full
    max_staleness_days: 2
    known_gaps: The official DeepSeek API change log, including model availability, API behavior and pricing. Web and mobile changes appear only when explicitly included in the API announcement; this is not a complete consumer-app history. Benchmark tables and code examples are excluded.
    themes: [model-support, context-window, search-browsing, pricing-model, reliability-performance]
