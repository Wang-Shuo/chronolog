site:
  repository: https://github.com/Wang-Shuo/chronolog
products:
  - name: suno
    display_name: Suno
    feed_type: suno_changelog
    url: https://suno.com/release-notes
    backfill: full
    max_staleness_days: 2
    known_gaps: All dated entries currently published on the official release-notes index, including mobile, Studio and model announcements. Earlier changes absent from this endpoint are outside coverage.
    themes: [music-generation, voice, model-support, collaboration, pricing-model, mobile-desktop]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: runway
    display_name: Runway
    feed_type: runway_changelog
    url: https://runway.com/changelog
    backfill: full
    max_staleness_days: 2
    known_gaps: All dated descriptions currently available on the official changelog. Multiple announcements on one date remain separate; the source does not provide individual entry permalinks.
    themes: [video-generation, image-generation, voice, model-support, collaboration, pricing-model]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: midjourney
    display_name: Midjourney
    feed_type: midjourney_changelog
    url: https://updates.midjourney.com/
    index_url: https://updates.midjourney.com/sitemap-posts.xml
    backfill: full
    max_staleness_days: 2
    known_gaps: Posts listed in the official updates sitemap, including alpha tests and community announcements. Dates are article publication dates, not sitemap modification dates or dates mentioned in titles; older Discord-only announcements are outside coverage.
    themes: [image-generation, video-generation, model-support, interface-experience, pricing-model]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
