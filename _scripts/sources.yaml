    max_staleness_days: 2
    known_gaps: The dated entries currently available in the official Claude app release notes, including model and plan announcements listed there. This endpoint currently starts in August 2025; it is not Claude's launch date. Claude Code has a separate history.
    themes: [model-support, agent-mode, memory, file-data, apps-integrations, safety-privacy, enterprise-admin, pricing-model]
