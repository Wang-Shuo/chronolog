    backfill: full
    max_staleness_days: 2
    known_gaps: All published entries returned by the official public changelog, traversing every cumulative page. Drafts, deleted entries and private feedback are excluded.
    themes: [presentation-creation, artifact-creation, image-generation, file-data, apps-integrations, collaboration]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
