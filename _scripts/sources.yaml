site:
  repository: https://github.com/Wang-Shuo/chronolog
products:
  - name: chatgpt
    display_name: ChatGPT
    feed_type: chatgpt_changelog
    url: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
    backfill: full
    # Refreshed from a manual browser snapshot (about weekly) while automated access is
    # refused; pipeline_health flags reviewed data older than this many days.
    max_staleness_days: 8
    themes: [multimodal, voice, memory, image-generation, search-browsing, apps-integrations, safety-privacy, enterprise-admin, mobile-desktop, model-support, pricing-model, automation-scheduling, projects-workspaces, accessibility-localization, learning-tools]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: claude-code
    display_name: Claude Code
    feed_type: github_releases
    repo: anthropics/claude-code
    backfill: full
    max_staleness_days: 2
    themes: [agent-mode, context-window, model-support, editor-experience, collaboration, apps-integrations, safety-privacy, automation-scheduling, projects-workspaces, accessibility-localization]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: cursor
    display_name: Cursor
    feed_type: cursor_changelog
    url: https://cursor.com/changelog
    backfill: full
    max_staleness_days: 2
    themes: [agent-mode, context-window, model-support, editor-experience, collaboration, apps-integrations, enterprise-admin, mobile-desktop, pricing-model, automation-scheduling, projects-workspaces, accessibility-localization]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: aider
    display_name: Aider
    feed_type: github_releases
    repo: Aider-AI/aider
    backfill: full
    max_staleness_days: 2
    include_prereleases: false
    tag_pattern: '^v\d+\.\d+\.\d+$'
    known_gaps: Stable versioned GitHub releases only; preview builds and unannounced changes are excluded. The latest upstream release may be older than the last successful fetch.
    themes: [agent-mode, model-support, editor-experience]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: continue
    display_name: Continue
    enabled: false
    feed_type: github_releases
    repo: continuedev/continue
    backfill: full
    themes: [model-support, editor-experience, context-window]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: tabby
    display_name: Tabby
    enabled: false
    feed_type: github_releases
    repo: TabbyML/tabby
    backfill: full
    themes: [editor-experience, model-support]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: openhands
    display_name: OpenHands
    feed_type: github_releases
    repo: OpenHands/OpenHands
    backfill: full
    max_staleness_days: 2
    include_prereleases: false
    tag_pattern: '^v?\d+\.\d+\.\d+$'
    known_gaps: Stable versioned releases of the OpenHands application available from its current repository. SDK releases, preview builds and temporary PR evidence uploads are excluded; endpoint coverage does not establish the product's launch date.
    themes: [agent-mode, model-support]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
  - name: codex-cli
    display_name: Codex CLI
    feed_type: github_releases
    repo: openai/codex
    # Binary asset metadata makes 100-item responses large enough to time out.
    github_page_size: 20
    backfill: full
    max_staleness_days: 2
    include_prereleases: false
    tag_pattern: '^(?:rust-)?v\d+\.\d+\.\d+$'
    known_gaps: Stable versioned Codex CLI releases only; alpha builds, SDK-only releases, the Codex app and cloud-only announcements are outside this source's scope.
    themes: [agent-mode, model-support, context-window, developer-workflow, apps-integrations, safety-privacy, automation-scheduling]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
