    index_url: https://elevenlabs.io/docs/changelog/llms.txt
    backfill: full
    max_staleness_days: 2
    known_gaps: Every dated entry listed in the official changelog index, including voice, audio, agent and API updates. The default Markdown page contains only a recent window, so collection traverses the complete index. Documentation widgets and code examples are excluded.
    themes: [voice, model-support, agent-mode, apps-integrations, safety-privacy, pricing-model]
