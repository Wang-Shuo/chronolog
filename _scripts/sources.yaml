    surfaces: [hub, ide]
    backfill: full
    max_staleness_days: 2
    known_gaps: Dated versions of the Antigravity App (hub) and original IDE on the official changelog. Separately versioned CLI, SDK, editor extensions and undated model-launch cards are outside this scope.
    themes: [agent-mode, editor-experience, model-support, apps-integrations, developer-workflow, projects-workspaces]
    track_silence: true
    silence_window: month
    silence_periods: 2
    silence_baseline_factor: 0.5
    language: en
