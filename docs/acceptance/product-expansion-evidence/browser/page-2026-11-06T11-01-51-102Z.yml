          - text: ) introduces Background Agent for parallel task execution. The
          - link "2025-06-04 release" [ref=e1095] [cursor=pointer]:
            - /url: https://cursor.com/changelog/1-0
          - text: (
          - link "archived" [ref=e1098] [cursor=pointer]:
            - /url: /Releases/Cursor/cursor-2025-06-04-1-0-https-cursor-com-changelog-1-0-237767ca
          - text: ) expands access to the same remote coding agent, with privacy-mode limitations at that time, a within-product expansion of one named capability.
        - paragraph [ref=e1099]:
          - text: ChatGPT's
          - link "2026-07-09 Work announcement" [ref=e1100] [cursor=pointer]:
            - /url: https://help.openai.com/en/articles/6825453-chatgpt-release-notes#introducing-chatgpt-work
