            - /url: /Releases/ChatGPT/chatgpt-2026-09-29-meet-your-dot-8b9f914b
          - text: ) adds ongoing goals on a cloud computer, with plan and regional restrictions. Both are general-work agents, a different scope from Cursor's repository-oriented remote coding agent.
