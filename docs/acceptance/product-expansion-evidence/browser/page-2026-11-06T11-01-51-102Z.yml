          - text: ) describes longer research and creation tasks across apps and files, with user direction and approvals.
          - link "Dots on 2026-09-29" [ref=e1104] [cursor=pointer]:
            - /url: https://help.openai.com/en/articles/6825453-chatgpt-release-notes#meet-your-dot
